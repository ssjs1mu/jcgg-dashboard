plugins { id 'com.android.application' }
android {
  namespace 'com.joshiscorner.dashboard'
  compileSdk 34
  defaultConfig {
    applicationId 'com.joshiscorner.dashboard'
    minSdk 24
    targetSdk 34
    versionCode (System.getenv('BUILD_NO') ?: '1') as int
    versionName '1.0.' + (System.getenv('BUILD_NO') ?: '1')
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('KS_FILE') ?: 'none.jks')
      storePassword System.getenv('KS_PASS')
      keyAlias System.getenv('KS_ALIAS') ?: 'joshiscorner'
      keyPassword System.getenv('KS_PASS')
      enableV1Signing true
      enableV2Signing true
      enableV3Signing true
    }
  }
  buildTypes {
    release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
