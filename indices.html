<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Joshi's Corner - Index Movers</title>
<style>
:root{--bg:#0e1621;--card:#16243a;--line:#2d4260;--tx:#f1f5fb;--mu:#a9b8cc;--gold:#e0cd96;--up:#35f0a8;--dn:#ff6b9d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0e1621,#0a111a);color:var(--tx);font:13px/1.35 "Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;padding:8px 10px 30px;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1800px;margin:0 auto 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.top h1{font:400 30px/1 "Brush Script MT","Segoe Script",cursive;color:var(--gold);margin-right:auto}
.sw{display:inline-block;padding:5px 13px;border-radius:999px;background:linear-gradient(180deg,#ffd35c,#d9a21c);color:#1a1030;font:800 12px "Segoe UI",sans-serif;text-decoration:none}
.sw.on{background:#1d3a5c;color:#9ee7ff;border:1px solid #2fd0ff;pointer-events:none}
.st{font:700 12px ui-monospace,Consolas,monospace;color:var(--mu)}.st b{color:var(--up)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1800px;margin:0 auto 8px}
.ctl label{font:800 11.5px "Segoe UI";letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
select,.btn{background:#10263d;color:#fff;border:1px solid #2fd0ff;border-radius:7px;padding:5px 8px;font:700 13px "Segoe UI";cursor:pointer}
.btn{background:#14507a}
.grid{display:grid;gap:8px;max-width:1800px;margin:0 auto;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));align-items:start}
.pn{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;min-width:0}
.ph{padding:5px 6px;background:#0f1d30}
.ph select{width:100%;font-size:14px;text-align:center;text-align-last:center;letter-spacing:.03em}
.tile{display:grid;grid-template-columns:1.4fr 1fr 1fr;text-align:center;padding:5px 2px;font:800 17px ui-monospace,Consolas,monospace;border-top:2px solid #0a111a;border-bottom:2px solid #0a111a}
.tile small{display:block;font:700 10px "Segoe UI";letter-spacing:.08em;opacity:.8;text-transform:uppercase}
.tile.up{background:linear-gradient(135deg,#0b3a31,#0f6a52);color:#4dffbe}.tile.dn{background:linear-gradient(135deg,#40102c,#85204b);color:#ff86b0}
.sec{padding:2px 8px;font:800 10.5px "Segoe UI";letter-spacing:.12em;text-transform:uppercase;background:#0c1829;color:var(--mu)}
.fx{height:calc(26px*10 + 26px);overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
th{background:#243a58;color:#fff;font:800 10.5px "Segoe UI";letter-spacing:.04em;text-transform:uppercase;padding:4px 4px;text-align:right;position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left;width:25%;padding-left:6px}th:nth-child(2){width:21%}th:nth-child(3){width:16%}th:nth-child(4){width:12%}th:nth-child(5){width:12%}
td{padding:0 3px;height:26px;text-align:right;font:700 12.5px ui-monospace,Consolas,"Courier New",monospace;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td:first-child{font:800 12.5px "Segoe UI",sans-serif}
.hp .p6{display:none}.hp th:nth-child(1),.hp td:first-child{width:30%}
tr.fu td{animation:fu .9s}tr.fd td{animation:fd .9s}
@keyframes fu{from{background:#3dffb4}}@keyframes fd{from{background:#ff6b9d}}
.note{color:var(--mu);font:12px/1.5 "Segoe UI";max-width:1800px;margin:8px auto 0}
@media(max-width:1000px){.grid{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))!important}}
</style>
<style id="jcTheme">
/* Light theme: one switch for the whole app. Implemented as a colour inversion of the finished page with hue kept, so every panel, table, chart and popup follows; media is flipped back. */
html.jc-light{filter:invert(1) hue-rotate(180deg);background:#fff}
html.jc-light img,html.jc-light video,html.jc-light iframe{filter:invert(1) hue-rotate(180deg)}
#jcThemeB{position:fixed;right:10px;bottom:10px;z-index:99999;width:38px;height:38px;border-radius:50%;border:1px solid #2fd0ff;background:#0d5a73;color:#fff;font:700 18px/1 "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
html.jc-light #jcThemeB{filter:none}
</style>
<script>(function(){ try{ if(localStorage.getItem('jc_theme')==='light') document.documentElement.classList.add('jc-light'); }catch(e){}
 document.addEventListener('DOMContentLoaded',function(){ var b=document.createElement('button'); b.id='jcThemeB'; b.type='button'; var r=document.documentElement;
  function set(){ var l=r.classList.contains('jc-light'); b.textContent=l?'🌙':'☀'; b.title=l?'Switch to the dark theme':'Switch to the light theme'; }
  b.onclick=function(){ r.classList.toggle('jc-light'); try{ localStorage.setItem('jc_theme',r.classList.contains('jc-light')?'light':'dark'); }catch(e){} set(); };
  set(); document.body.appendChild(b); }); })();</script>
</head>
<body>
<div class="top"><h1>Joshi's Corner</h1>
 <a class="sw" href="trading.html">TRADING TERMINAL</a><a class="sw" href="./">MACRO DASHBOARD</a><a class="sw on" href="indices.html">INDEX MOVERS</a>
 <span class="st" id="st">connecting…</span></div>
<div class="ctl"><label>Panels</label><select id="cn"><option>2</option><option>3</option><option>4</option><option>5</option></select>
 <label>Order index list by</label><select id="so"><option value="b">Day move: best first</option><option value="w">Day move: worst first</option><option value="n">Name</option></select>
 <button class="btn" id="au">Auto: best + worst indices</button><span class="st" id="info"></span></div>
<div class="grid" id="gr"></div>
<div class="note" id="nt"></div>
<script>
const BACKEND='https://script.google.com/macros/s/AKfycbzMp82oHzLzKpaE0LrnUqEGGot7jqSw9e9VA1QhJNOPV35vOIYcfIChFL5PCDuD2Ahi5Q/exec';
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let CONS=null, PX={}, PCX={}, PCT={}, LV={}, prev={}, NP=ld('jc_np',4), SO=ld('jc_so','b'), PAN=ld('jc_pan',['NIFTY 50','NIFTY BANK','NIFTY MIDCAP 50','NIFTY AUTO','NIFTY METAL']), AP={};
const f2=v=>v==null?'–':v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>(v>0?'+':'')+f2(v);
async function J(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||25000);try{const r=await fetch(u,{signal:c.signal,cache:'no-store'});return JSON.parse(await r.text())}finally{clearTimeout(t)}}
const ist=()=>new Date(Date.now()+19800000), istDay=()=>ist().toISOString().slice(0,10), frac=()=>{const d=ist(),m=d.getUTCHours()*60+d.getUTCMinutes();return m>=555&&m<=930?Math.max((m-555)/375,0.04):1;};
async function loadCons(){ for(const u of ['https://raw.githubusercontent.com/ssjs1mu/jcgg-dashboard/idx/idx.json?x='+Date.now(),'https://api.github.com/repos/ssjs1mu/jcgg-dashboard/contents/idx.json?ref=idx']){ try{ let j=await J(u,20000); if(j.content) j=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))); if(j&&j.indices&&j.floats){ CONS=j; return; } }catch(e){} } }
async function pcLoad(ys){ const today=istDay();
  await Promise.all(ys.filter(y=>y&&(!PCT[y]||Date.now()-PCT[y]>1800000)).map(async y=>{ PCT[y]=Date.now(); try{ const j=await J(BACKEND+'?action=fetch&url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(y)+'?range=7d&interval=1d')), r=j.chart.result[0], c=r.indicators.quote[0].close, t=r.timestamp.map(v=>new Date((v+19800)*1000).toISOString().slice(0,10)); let i=t.length-1; while(i>0&&(t[i]>=today||c[i]==null)) i--; if(c[i]) PCX[y]=c[i]; }catch(e){ PCT[y]=0; } })); }
async function pull(){
  try{
    const syms=Object.keys(CONS.floats).map(s=>s+'.NS'), ys=PAN.slice(0,NP).map(n=>CONS.indices[n]&&CONS.indices[n].y).filter(Boolean), k=Math.ceil(syms.length/3), parts=[syms.slice(0,k).concat(ys),syms.slice(k,2*k),syms.slice(2*k)];
    await pcLoad(ys);
    const rs=await Promise.all(parts.map(p=>J(BACKEND+'?action=liveq&symbols='+encodeURIComponent(p.join(',')),30000).catch(()=>null)));
    rs.forEach(j=>{ if(j&&j.ok) Object.keys(j.q).forEach(key=>{ const q=j.q[key]; if(!q||!q[0]||!q[1]) return; if(key.endsWith('.NS')&&!key.startsWith('NIFTY')) PX[key.slice(0,-3)]={p:q[0],pc:q[1],v:q[5],av:q[6]}; else LV[key]={p:q[0]}; }); });
    $('st').innerHTML='<b>● LIVE</b> '+ist().toISOString().slice(11,19)+' IST · '+Object.keys(PX).length+' stocks';
  }catch(e){ $('st').textContent='feed retrying…'; }
  paint();
}
function calc(name){
  const I=CONS.indices[name], rows=[]; let sp=0, sc=0;
  I.rows.forEach(r=>{ const q=PX[r[0]], fs=CONS.floats[r[0]]; if(q&&fs) rows.push({s:r[0],p:q.p,pc:q.pc,fs,rv:q.av?q.v/(q.av*frac()):null}); });
  rows.forEach(r=>{ sp+=r.fs*r.p; sc+=r.fs*r.pc; });
  const apx=sc?(sp/sc-1)*100:0, y=I.y, lp=y&&LV[y]?LV[y].p:null, lc=y&&PCX[y]?PCX[y]:null, real=lp&&lc;
  const pct=real?(lp/lc-1)*100:apx, move=real?lp-lc:null;
  rows.forEach(r=>{ r.ch=r.p-r.pc; r.pct=r.ch/r.pc*100; r.w=sp?r.fs*r.p/sp*100:0; r.pts=real?(r.fs*r.pc/sc)*(r.pct/100)*lc:null; });
  if(real){ const raw=rows.reduce((a,r)=>a+r.pts,0), k=raw?move/raw:1; if(k>0.3&&k<3) rows.forEach(r=>r.pts*=k); }
  return {name,rows,pct,apx,real,lp,lc,move,n:rows.length,tot:I.rows.length};
}
function tint(p){ const a=Math.min(Math.abs(p)/3,1), al=(0.10+a*0.55).toFixed(2); return p>0?'rgba(20,200,140,'+al+')':p<0?'rgba(235,60,120,'+al+')':'transparent'; }
function rvBg(v){ if(v==null) return 'transparent'; return v>=1?'rgba(30,200,120,'+Math.min(0.25+(v-1)*0.25,0.85).toFixed(2)+')':'rgba(235,70,90,'+Math.min(0.25+(1-v)*0.8,0.85).toFixed(2)+')'; }
function rowH(r,i,key){ const k=key+r.s, o=prev[k], fl=o==null||o===r.p?'':(r.p>o?' fu':' fd'); prev[k]=r.p; const tc=r.pct>0?'#eafff6':r.pct<0?'#fff0f6':'#fff';
  return '<tr class="'+fl.trim()+'" style="background:'+tint(r.pct)+';color:'+tc+'"><td title="'+r.s+'">'+r.s+'</td><td>'+f2(r.p)+'</td><td style="background:'+tint(r.pct*1.6)+'">'+sg(r.pct)+'%</td><td style="background:'+rvBg(r.rv)+'">'+(r.rv==null?'–':r.rv.toFixed(2))+'</td><td>'+r.w.toFixed(2)+'</td><td class="p6">'+(r.pts==null?'–':sg(r.pts))+'</td></tr>'; }
const HEAD='<tr><th>Symbol</th><th>Price</th><th>% Chg</th><th>RVOL</th><th>Wt %</th><th class="p6">Pts</th></tr>';
function build(){
  const g=$('gr'); g.style.setProperty('--n',NP); g.className='grid'+(NP>=5?' hp':'');
  while(g.children.length>NP) g.lastChild.remove();
  for(let i=g.children.length;i<NP;i++){ const d=document.createElement('div'); d.className='pn'; d.innerHTML='<div class="ph"><select></select></div><div class="pb"></div>'; d.querySelector('select').onchange=function(){ PAN[i]=this.value; sv('jc_pan',PAN); pull(); }; g.appendChild(d); }
}
function paint(){
  if(!CONS) return; build();
  const all=Object.keys(CONS.indices); AP={}; all.forEach(n=>AP[n]=calc(n));
  const ord=all.slice().sort((a,b)=>SO==='n'?a.localeCompare(b):SO==='w'?AP[a].pct-AP[b].pct:AP[b].pct-AP[a].pct);
  Array.from($('gr').children).forEach((el,i)=>{
    const sel=el.querySelector('select'), nm=PAN[i]&&CONS.indices[PAN[i]]?PAN[i]:ord[i]; PAN[i]=nm;
    if(document.activeElement!==sel){ sel.innerHTML=ord.map(n=>'<option value="'+n+'">'+n+'  '+(AP[n].pct>=0?'▲ ':'▼ ')+sg(AP[n].pct)+'%'+(AP[n].real?'':' ≈')+'</option>').join(''); sel.value=nm; }
    const D=AP[nm], s=D.rows.slice().sort((a,b)=>b.pct-a.pct), key=i+nm, up=D.pct>=0;
    el.querySelector('.pb').innerHTML='<div class="sec">▲ Top 5 gainers</div><table>'+HEAD+s.slice(0,5).map(r=>rowH(r,0,key+'g')).join('')+'</table><div class="sec">▼ Top 5 decliners</div><table>'+HEAD+s.slice(-5).reverse().map(r=>rowH(r,0,key+'d')).join('')+'</table>'
      +'<div class="tile '+(up?'up':'dn')+'"><div>'+(D.lp?f2(D.lp):'≈ calc')+'<small>'+(D.real?'index':'weighted')+'</small></div><div>'+(D.move!=null?sg(D.move):'–')+'<small>points</small></div><div>'+sg(D.pct)+'%<small>'+D.rows.filter(r=>r.pct>0).length+'▲ '+D.rows.filter(r=>r.pct<0).length+'▼</small></div></div>'
      +'<div class="fx"><table>'+HEAD+D.rows.slice().sort((a,b)=>b.w-a.w).map(r=>rowH(r,0,key+'c')).join('')+'</table></div>';
  });
  const top=ord.slice().sort((a,b)=>AP[b].pct-AP[a].pct); $('info').textContent='Best today: '+top[0]+' '+sg(AP[top[0]].pct)+'% · Weakest: '+top[top.length-1]+' '+sg(AP[top[top.length-1]].pct)+'%';
  $('nt').innerHTML='Open any panel dropdown to switch index (list shows each index day move; ≈ = computed from its stocks, otherwise the live index). Rows: gainers and decliners (top 5 each), index tile, then all stocks by weight in a 10-row window (scroll). Wt % = free-float shares x live price. Pts = stock weight x % move scaled to the index move. RVOL = volume vs 20-day average at this time of day (green above 1, red below). Sensex weights are estimated; Nifty 500, 200 and 100 are shown as listed by NSE.';
}
(async function(){
  $('cn').value=NP; $('so').value=SO;
  $('cn').onchange=()=>{ NP=+$('cn').value; sv('jc_np',NP); pull(); }; $('so').onchange=()=>{ SO=$('so').value; sv('jc_so',SO); paint(); };
  $('au').onclick=()=>{ const o=Object.keys(AP).filter(n=>AP[n].n>=8&&!/NIFTY (500|200|100|50|NEXT 50)$/.test(n)).sort((a,b)=>AP[b].pct-AP[a].pct), h=Math.ceil(NP/2); PAN=o.slice(0,h).concat(o.slice(-(NP-h))); sv('jc_pan',PAN); pull(); };
  await loadCons(); if(!CONS){ $('st').textContent='constituents not available'; return; }
  await pull(); setInterval(pull,20000);
})();
</script>
</body></html>
