<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshi's Corner - Macro Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Brush+Script+MT&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131722;
            --text-primary: #d1d4dc;
            --text-secondary: #787b86;
            --accent-green: #089981;
            --accent-red: #f23645;
            --border-color: #2a2e39;
            --hover-bg: #1e222d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #363c4e;
            padding-bottom: 16px;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .macro-trend-indicator {
            background: rgba(242, 54, 69, 0.15);
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: boldBlink 1.2s infinite ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(242, 54, 69, 0.3);
        }

        @keyframes boldBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.98); }
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 52px;
            font-weight: bold;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .header-title .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .system-status {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            font-size: 13px;
        }

        .badge-live {
            background: rgba(8, 153, 129, 0.15);
            color: var(--accent-green);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 10px rgba(8, 153, 129, 0.2);
        }

        .badge-live::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .time-box, .timer-box {
            background: #181c25;
            border: 2px solid #363c4e;
            padding: 8px 12px;
            border-radius: 6px;
            color: #fcf6ba;
            font-weight: 600;
            font-family: monospace;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 22px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid #363c4e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.02);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: #434c64;
        }

        .card-header {
            padding: 14px 18px;
            background-color: #181c25;
            border-bottom: 2px solid #363c4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #222734;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #131722;
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 2px solid #2a2e39;
        }

        tr:hover {
            background-color: var(--hover-bg);
        }

        .positive {
            color: var(--accent-green);
            font-weight: 600;
        }

        .negative {
            color: var(--accent-red);
            font-weight: 600;
        }

        .status-open {
            color: var(--accent-green);
            font-size: 11px;
            background: rgba(8, 153, 129, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent-green);
            font-weight: 700;
        }

        .status-closed {
            color: var(--text-secondary);
            font-size: 11px;
            background: rgba(120, 123, 134, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #787b86;
            font-weight: 700;
        }

        .trend-up::before { content: '▲ '; font-size: 10px; }
        .trend-down::before { content: '▼ '; font-size: 10px; }

        .gauge-bar-container {
            background: #2a2e39;
            border-radius: 4px;
            overflow: hidden;
            height: 10px;
            width: 100%;
            margin-top: 4px;
            border: 1px solid #363c4e;
        }

        .gauge-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f23645 0%, #ffa700 50%, #089981 100%);
            border-radius: 3px;
        }

        footer {
            margin-top: 28px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            border-top: 2px solid #2a2e39;
            padding-top: 14px;
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            header {
                grid-template-columns: 1fr;
                text-align: center;
                justify-items: center;
            }
            .header-left, .system-status {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="macro-trend-indicator" id="global-trend-badge">
                <span id="trendTxt">… GLOBAL TREND</span>
            </div>
        </div>
        <div class="header-title">
            <h1>Joshi's Corner</h1><a href="trading.html" style="display:inline-block;margin-top:6px;padding:4px 12px;border-radius:6px;background:linear-gradient(180deg,#ffd35c,#d9a21c);color:#1a1030;font:800 12px 'Segoe UI',sans-serif;text-decoration:none;letter-spacing:.04em">◂ TRADING TERMINAL</a>
            <div class="subtitle">Macro Intelligence Dashboard (live)</div>
        </div>
        <div class="system-status">
            <div class="badge-live" id="live-indicator">CONNECTING…</div>
            <div class="time-box" id="ist-clock">IST: --:--:--</div>
            <div class="timer-box" id="market-timer">CLOSING IN: --:--:--</div>
        </div>
    </header>

    <div class="dashboard-grid" id="grid"><div class="card"><div class="card-header"><h2>Loading live data…</h2></div></div></div>

    <footer>
        <p>Joshi's Corner Wealth Desk Terminal &bull; Calibrated with global futures and derivatives pricing &bull; All rights reserved.</p>
    </footer>


    <script>
    const API='https://api.github.com/repos/ssjs1mu/jcgg-dashboard/contents/', RAW='https://raw.githubusercontent.com/';
    const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fm=(v,d)=>v==null||isNaN(v)?'n/a':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});
    async function getJ(urls){ for(const u of urls){ try{ const r=await fetch(u,u.includes('api.github')?{headers:{Accept:'application/vnd.github.raw'},cache:'no-store'}:{cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){} } return null; }
    const SEC=[
     ['🇮🇳 Indian Market (spot indices)','indian-status',[['NIFTY 50','^NSEI','INR (₹)',2],['BANK NIFTY','^NSEBANK','INR (₹)',2],['SENSEX','^BSESN','INR (₹)',2],['NIFTY IT','^CNXIT','INR (₹)',2],['NIFTY MIDCAP','^NSMIDCP','INR (₹)',2],['INDIA VIX','^INDIAVIX','Points',2],['USD/INR','USDINR=X','INR / USD',4],['India 10Y yield',null,'Yield %'],['Nifty PCR',null,'Ratio']]],
     ['🇺🇸 US Index Futures & Treasuries',null,[['Dow futures','YM=F','USD',2],['S&P 500 futures','ES=F','USD',2],['Nasdaq 100 futures','NQ=F','USD',2],['US 10Y yield','^TNX','Yield %',3],['10Y T-Note futures','ZN=F','USD',3],['US Dollar Index','DX-Y.NYB','Index',3]]],
     ['🌏 Asian Indices',null,[['Nikkei 225','^N225','JPY',2],['Hang Seng','^HSI','HKD',2],['Taiwan Weighted','^TWII','TWD',2],['China A50','XIN9.FGI','USD',2],['Gift Nifty',null,'—']]],
     ['🇪🇺 European Indices',null,[['DAX','^GDAXI','EUR',2],['FTSE 100','^FTSE','GBP',2],['Euro Stoxx 50','^STOXX50E','EUR',2],['Euro-Bund / Long Gilt',null,'—']]],
     ['🛢️ Commodities (futures)',null,[['Brent crude','BZ=F','USD',2],['WTI crude','CL=F','USD',2],['Gold','GC=F','USD',2],['Silver','SI=F','USD',3],['Copper','HG=F','USD',3],['Natural gas','NG=F','USD',3]]]];
    let SNAP=null, last=0;
    function tbl(sec){ const [t,st,rows]=sec; let up=0,n=0;
      const body=rows.map(r=>{ const q=r[1]&&SNAP&&SNAP.m[r[1]]; if(!q) return `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[2])}</td><td>n/a</td><td>no free feed</td></tr>`;
        const ch=q.p-q.pc, pc=q.pc?ch/q.pc*100:0, inv=/VIX|USD\/INR|yield/i.test(r[0]), cls=(inv?ch<0:ch>0)?'positive':(ch===0?'':'negative'); if(!/VIX|yield|USD\/INR|Dollar/i.test(r[0])){n++;if(ch>0)up++;}
        return `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[2])}</td><td>${fm(q.p,r[3])}</td><td class="${cls}">${ch>=0?'+':''}${fm(ch,r[3]>3?3:2)} (${pc>=0?'+':''}${fm(pc,2)}%)</td></tr>`; }).join('');
      return `<div class="card"><div class="card-header"><h2>${t}</h2>${st?`<span class="status-open" id="${st}">…</span>`:''}</div><div class="table-container"><table><colgroup><col style="width:32%"><col style="width:18%"><col style="width:20%"><col style="width:30%"></colgroup><thead><tr><th>Instrument</th><th>Currency</th><th>Last</th><th>Change (%)</th></tr></thead><tbody>${body}</tbody></table></div></div>`; }
    function render(){
      let h=SEC.map(tbl).join('');
      if(NEWS) h+=`<div class="card"><div class="card-header"><h2>📰 Live Market News</h2><span class="status-open">${NEWS.news.length} headlines</span></div><div class="table-container"><table><thead><tr><th style="width:22%">Source</th><th>Headline</th><th style="width:16%">Time IST</th></tr></thead><tbody>${NEWS.news.slice(0,12).map(n=>`<tr><td>${esc(n.src)}</td><td><a href="${esc(n.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(n.title)}</a></td><td>${new Date(n.t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})}</td></tr>`).join('')}</tbody></table></div></div>`;
      const v=SNAP&&SNAP.m['^INDIAVIX']; if(v){ const lv=v.p<13?'Low - complacent':v.p<18?'Normal':v.p<24?'Elevated':'High fear'; h+=`<div class="card"><div class="card-header"><h2>📊 Market Sentiment (India VIX)</h2></div><div class="table-container"><table><thead><tr><th>Measure</th><th>Value</th><th>Reading</th></tr></thead><tbody><tr><td><strong>India VIX</strong></td><td>${fm(v.p)}</td><td>${lv}</td></tr></tbody></table></div></div>`; }
      if(FD){ const d=Object.keys(FD.daily).sort().slice(-6).reverse(); const m=FD.fpi_equity_monthly||{}, yr=new Date().getFullYear(), ytd=Object.keys(m).filter(k=>k.startsWith(yr)).reduce((a,k)=>a+m[k],0), c=x=>x>=0?'positive':'negative';
        h+=`<div class="card"><div class="card-header"><h2>🏛️ Institutional Flows (₹ crore, NSE cash)</h2><span class="status-open">${esc(d[0]||'')}</span></div><div class="table-container"><table><thead><tr><th>Date</th><th>FII net</th><th>DII net</th></tr></thead><tbody>${d.map(k=>`<tr><td>${k}</td><td class="${c(FD.daily[k].fii_net)}">${fm(FD.daily[k].fii_net,0)}</td><td class="${c(FD.daily[k].dii_net)}">${fm(FD.daily[k].dii_net,0)}</td></tr>`).join('')}<tr><td><strong>FPI equity ${yr} YTD (NSDL, to ${esc(FD.fpi_equity_upto)})</strong></td><td class="${c(ytd)}">${fm(ytd,0)}</td><td>DII YTD n/a</td></tr></tbody></table></div></div>`; }
      if(OI){ const rows=Object.entries(OI.stocks).map(([k,x])=>[k,x,(x.ce||0)+(x.pe||0)]).sort((a,b)=>b[2]-a[2]).slice(0,12);
        h+=`<div class="card" style="grid-column:1/-1"><div class="card-header"><h2>🎯 Stock Option OI (last close, nearest expiry)</h2><span class="status-open">${esc((OI.asof||'').slice(0,10))}</span></div><div class="table-container"><table><thead><tr><th>Stock</th><th>Spot</th><th>Expiry</th><th>PCR</th><th>Call wall</th><th>Put wall</th><th>Total OI</th></tr></thead><tbody>${rows.map(([k,x,t])=>`<tr><td><strong>${esc(k)}</strong></td><td>${fm(x.spot)}</td><td>${esc(x.expiry)}</td><td class="${x.pcr>=1?'positive':'negative'}">${fm(x.pcr)}</td><td>${fm(x.callWall,0)}</td><td>${fm(x.putWall,0)}</td><td>${fm(t,0)}</td></tr>`).join('')}</tbody></table></div></div>`; }
      document.getElementById('grid').innerHTML=h;
      // badges
      const ks=['^NSEI','^N225','^HSI','^GDAXI','^FTSE','ES=F','NQ=F','YM=F'], ch=ks.map(k=>SNAP&&SNAP.m[k]).filter(Boolean).map(q=>q.pc?(q.p/q.pc-1)*100:0), av=ch.length?ch.reduce((a,b)=>a+b,0)/ch.length:null;
      const tb=document.getElementById('trendTxt'), li=document.getElementById('live-indicator');
      if(av==null){ tb.textContent='GLOBAL TREND: no data'; } else tb.textContent=(av>0.3?'▲ GLOBAL TREND: RISK-ON':av<-0.3?'▼ GLOBAL TREND: RISK-OFF':'◆ GLOBAL TREND: MIXED')+' ('+(av>=0?'+':'')+av.toFixed(2)+'% avg)';
      if(SNAP){ const age=Math.round((Date.now()-SNAP.ts)/60000); li.textContent=age<=15?'LIVE FEED (GitHub snapshot, '+age+' min old)':'SNAPSHOT '+(age>1440?Math.round(age/1440)+' d':age>=60?Math.round(age/60)+' h':age+' min')+' old'; li.style.opacity=age<=15?1:.7; } else li.textContent='FEED UNAVAILABLE';
      updateTerminalClock();
    }
    let NEWS=null,FD=null,OI=null;
    async function loadAll(){
      const j=await getJ([API+'snapshot.json?ref=snapshot',RAW+'ssjs1mu/jcgg-dashboard/snapshot/snapshot.json?x='+Date.now(),'data/snapshot.json']);
      if(j&&j.rows){ const m={}; j.rows.forEach(r=>{ if(r.p!=null&&r.pc!=null) m[r.s]={p:r.p,pc:r.pc,t:r.t}; }); SNAP={m,ts:j.ts?Date.parse(j.ts):Date.now()}; }
      NEWS=await getJ([API+'news.json?ref=news',RAW+'ssjs1mu/jcgg-dashboard/news/news.json?x='+Date.now()])||NEWS;
      FD=FD||await getJ([RAW+'ssjs1mu/jc-stock-analyst/main/data/fiidii.json']); OI=OI||await getJ([RAW+'ssjs1mu/jc-stock-analyst/main/data/fno_oi.json']);
      render();
    }
    loadAll(); setInterval(()=>{ if(!document.hidden) loadAll(); },60000);
    </script>
    <script>
        function updateTerminalClock() {
            const now = new Date();
            
            const options = { timeZone: 'Asia/Kolkata', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const timeString = new Intl.DateTimeFormat('en-GB', options).format(now);
            document.getElementById('ist-clock').textContent = 'IST: ' + timeString;

            const istParts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Kolkata',
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                weekday: 'short',
                hour12: false
            }).formatToParts(now);

            let hours = 0, minutes = 0, seconds = 0, weekday = '';
            for (let part of istParts) {
                if (part.type === 'hour') hours = parseInt(part.value, 10);
                if (part.type === 'minute') minutes = parseInt(part.value, 10);
                if (part.type === 'second') seconds = parseInt(part.value, 10);
                if (part.type === 'weekday') weekday = part.value;
            }

            const marketOpenHour = 9, marketOpenMin = 15;
            const marketCloseHour = 15, marketCloseMin = 30;

            const currentTotalSec = hours * 3600 + minutes * 60 + seconds;
            const openTotalSec = marketOpenHour * 3600 + marketOpenMin * 60;
            const closeTotalSec = marketCloseHour * 3600 + marketCloseMin * 60;

            const isWeekend = (weekday === 'Sat' || weekday === 'Sun');
            const statusEl = document.getElementById('indian-status');
            const timerEl = document.getElementById('market-timer');

            if (!statusEl || !timerEl) return;
            if (!isWeekend && currentTotalSec >= openTotalSec && currentTotalSec < closeTotalSec) {
                statusEl.textContent = "MARKET OPEN";
                statusEl.className = "status-open";

                let diffSec = closeTotalSec - currentTotalSec;
                let remH = Math.floor(diffSec / 3600);
                let remM = Math.floor((diffSec % 3600) / 60);
                let remS = diffSec % 60;

                timerEl.textContent = `CLOSING IN: ${String(remH).padStart(2, '0')}:${String(remM).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
            } else {
                statusEl.textContent = "MARKET CLOSED";
                statusEl.className = "status-closed";

                if (!isWeekend && currentTotalSec < openTotalSec) {
                    let diffSec = openTotalSec - currentTotalSec;
                    let remH = Math.floor(diffSec / 3600);
                    let remM = Math.floor((diffSec % 3600) / 60);
                    let remS = diffSec % 60;
                    timerEl.textContent = `OPENS IN: ${String(remH).padStart(2, '0')}:${String(remM).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
                } else {
                    timerEl.textContent = `SESSION ENDED`;
                }
            }
        }

        setInterval(updateTerminalClock, 1000);
        updateTerminalClock();
    </script>
</body>
</html>
