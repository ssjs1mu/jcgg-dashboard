name: Android app (APK)
# Builds the Joshi's Corner dashboard app from the public source in android/, signs it, and publishes it on the
# "android-app" release with its SHA-256 fingerprint. The app only shows the live site, so content changes never need a new APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_S" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/jc.jks"; echo "KS_PASS=$KS_PASS_S" >> "$GITHUB_ENV"; echo "KEY_KIND=permanent" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 24); echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/jc.jks" -alias joshiscorner -keyalg RSA -keysize 4096 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Joshi's Corner, O=Joshi's Corner, C=IN" >/dev/null
            echo "KS_PASS=$P" >> "$GITHUB_ENV"; echo "KEY_KIND=per-build" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/ks/jc.jks" >> "$GITHUB_ENV"; echo "KS_ALIAS=joshiscorner" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env: { BUILD_NO: '${{ github.run_number }}' }
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature, fingerprint
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signing.txt
          cp "$APK" JoshisCorner-Dashboard.apk
          sha256sum JoshisCorner-Dashboard.apk | tee JoshisCorner-Dashboard.apk.sha256
          "$BT/aapt" dump permissions JoshisCorner-Dashboard.apk | tee permissions.txt
          if grep -v "android.permission.INTERNET" permissions.txt | grep -q "uses-permission"; then echo "Unexpected permission!"; exit 1; fi
      - name: Publish on the android-app release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES="Joshi's Corner market dashboard - build ${{ github.run_number }} ($(date -u +%Y-%m-%d)), signing key: $KEY_KIND.
          SHA-256: $(cut -d' ' -f1 JoshisCorner-Dashboard.apk.sha256)
          Permissions: INTERNET only. Built by GitHub Actions from the public source in android/ (commit ${{ github.sha }})."
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "Joshi's Corner app" --notes "$NOTES" --latest=false
          gh release edit android-app --notes "$NOTES"
          gh release upload android-app JoshisCorner-Dashboard.apk JoshisCorner-Dashboard.apk.sha256 signing.txt permissions.txt --clobber
      - uses: actions/upload-artifact@v4
        with: { name: JoshisCorner-Dashboard-apk, path: 'JoshisCorner-Dashboard.apk*', retention-days: 30 }
