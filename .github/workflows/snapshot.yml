name: Trading screen quote snapshot (real Yahoo data, free, no Apps Script quota)
# Each run refreshes about every minute for ~4.5 minutes and force-pushes ONE commit to the `snapshot` branch
# (no history growth, no Pages redeploy). The screen reads that branch through the GitHub API.
on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'          # 08:30-16:30 IST
    - cron: '7,37 0-2,11-23 * * 1-5'    # rest of the weekday (world markets)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh loop
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ github.event.schedule }}" in '*/5 3-10 * * 1-5') N=5;; '') N=2;; *) N=1;; esac
          for i in $(seq 1 $N); do
            OUT=/tmp/snapshot.json python pipeline/snapshot.py || { sleep 20; continue; }
            if [ $((i % 2)) -eq 1 ] || [ ! -f /tmp/charts.json ]; then OUT_CH=/tmp/charts.new python pipeline/charts.py && mv /tmp/charts.new /tmp/charts.json || true; fi
            blob=$(git hash-object -w /tmp/snapshot.json)
            if [ -f /tmp/charts.json ]; then cb=$(git hash-object -w /tmp/charts.json); tree=$(printf '100644 blob %s\tcharts.json\n100644 blob %s\tsnapshot.json\n' "$cb" "$blob" | git mktree); else tree=$(printf '100644 blob %s\tsnapshot.json\n' "$blob" | git mktree); fi
            commit=$(git commit-tree "$tree" -m "snapshot $(date -u +%FT%TZ)")
            git push -q -f origin "$commit":refs/heads/snapshot || true
            if [ $i -lt $N ]; then sleep 45; fi
          done
          exit 0
