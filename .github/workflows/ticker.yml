name: Ticker (free self-running clock for the live feeds)

# GitHub's own schedules are often skipped (the heat-map's 5-minute schedule ran about twice a day).
# This clock lives inside GitHub: it loops for ~5h50m and, on trading-day hours (IST, Mon-Fri):
#   * every 5 minutes 09:10-15:40  -> starts the heat-map feed
#   * every 10 minutes 09:25-15:25 and 15:45 -> starts the High Net-worth Trade tracker (records every recommendation)
#   * every 10 minutes 08:00-16:00 -> starts the market-news feed (Watchlist news ticker)
# Just before its own limit it starts the next clock; a sparse schedule restarts the chain if it ever breaks.
on:
  schedule:
    - cron: '13,43 2-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Tick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 50*60 )); last=""; n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            ist=$(TZ=Asia/Kolkata date +%u%H%M); dow=${ist:0:1}; hm=$((10#${ist:1:4}))
            if [ "$dow" -le 5 ]; then
              if [ "$hm" -ge 910 ] && [ "$hm" -le 1540 ]; then gh workflow run heatmap.yml --ref main || true; fi
              n=$((n+1)); if [ "$hm" -ge 800 ] && [ "$hm" -le 1600 ] && [ $((n % 2)) -eq 1 ]; then gh workflow run news.yml --ref main || true; fi
              if [ "$hm" -ge 925 ] && [ "$hm" -le 1525 ] && [ $((n % 2)) -eq 0 ]; then gh workflow run hntrack.yml --ref main || true; fi
              if [ "$hm" -ge 1550 ] && [ "$hm" -lt 1555 ] && [ "$last" != "plan" ]; then gh workflow run nextday.yml --ref main || true; last=plan; fi
              for t in 1545; do
                if [ "$hm" -ge "$t" ] && [ "$hm" -lt $((t+5)) ] && [ "$last" != "$t" ]; then gh workflow run hntrack.yml --ref main || true; last=$t; fi
              done
            fi
            [ "$hm" -gt 1600 ] && break      # nothing more to do today
            sleep 300
          done
          [ "$hm" -le 1600 ] && gh workflow run ticker.yml --ref main || true
