<script>
'use strict';
const $=id=>document.getElementById(id), P=new URLSearchParams(location.search), C=(P.get('c')||'').toUpperCase();

$('lang').onchange=e=>{ try{ localStorage.setItem('jc_rep_lang',e.target.value); }catch(x){} const q=new URLSearchParams(location.search); q.set('lang',e.target.value); q.delete('print'); location.search=q.toString(); };
const BE='https://script.google.com/macros/s/AKfycbzMp82oHzLzKpaE0LrnUqEGGot7jqSw9e9VA1QhJNOPV35vOIYcfIChFL5PCDuD2Ahi5Q/exec';
const inr=(v,d=0)=>v==null||!isFinite(v)?'–':(v<0?'−':'')+'₹'+Math.abs(Number(v)).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(v,d=0)=>v==null||!isFinite(v)?'–':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const px=v=>num(v,v<100?2:0);   /* share price in text */
const pc=(v,d=2)=>v==null||!isFinite(v)?'–':(v>=0?'+':'')+v.toFixed(d)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'–';
const dlong=d=>d?(+d.slice(8,10))+' '+R.months[+d.slice(5,7)-1]+' '+d.slice(0,4):'–';
const today=PF.todayS(), days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5), addY=(d,y)=>(+d.slice(0,4)+y)+d.slice(4);
/* bank benchmarks - SBI card rates (general public) at the date of each deposit; editable here when rates change */
const FD_RATES=[['2000-01-01',6.80],['2025-04-15',6.70],['2025-05-16',6.50],['2025-06-15',6.25]];   // 1-2 yr FD
const SB_RATES=[['2000-01-01',2.70],['2025-06-15',2.50]];                                            // savings bank
let IDX_MU=0.11, MKT_MU=0.12, RHO=0.4;   /* outlook: Nifty base return, long-run market return, correlation between shares */
const rateOn=(T,d)=>T.filter(x=>x[0]<=d).slice(-1)[0][1];
/* logic parameters from the master sheet "JC Logic & Formula Reference" (jc-params.js); built-in values if it cannot be read */
const q=(k,d)=>window.JCP&&JCP.P[k]!=null?JCP.P[k]:d;
function useParams(){ IDX_MU=q('CR_IDX_MU',0.11); MKT_MU=q('CR_MKT_MU',0.12); RHO=q('CR_RHO',0.4);
  [[FD_RATES,'CR_FD_RATE'],[SB_RATES,'CR_SB_RATE']].forEach(([T,k])=>{ const v=q(k,null), f=q(k+'_FROM',null); if(v==null||!f) return; const i=T.findIndex(x=>x[0]===f); if(i>=0) T[i][1]=v; else if(f>T[T.length-1][0]){ if(T[T.length-1][1]!==v) T.push([f,v]); } }); }
useParams();
/* the same money in a bank: each deposit is its own deposit at the rate of its day (quarterly compounding), withdrawals come out of the oldest */
function bank(flows,T,toD){ const tr=[], val=(t,d)=>t.p*Math.pow(1+t.r/400,4*days(t.d,d)/365);
  flows.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(f=>{ if(f.v<0) tr.push({d:f.d,p:-f.v,r:rateOn(T,f.d)}); else { let w=f.v; while(w>0.005&&tr.length){ const t=tr[0], v=val(t,f.d); if(v<=w){ w-=v; tr.shift(); } else { t.p=(v-w)/Math.pow(1+t.r/400,4*days(t.d,f.d)/365); w=0; } } } });
  return tr.reduce((a,t)=>a+val(t,toD),0); }
async function quotes(syms){ const Q={}; if(!syms.length) return Q; try{ const j=await fetch(BE+'?action=liveq&symbols='+encodeURIComponent(syms.map(s=>s+'.NS').join(','))).then(r=>r.json());
  Object.keys(j.q||{}).forEach(k=>{ const q=j.q[k]; if(q&&q[0]>0) Q[k.replace(/\.NS$/,'')]={p:q[0],pc:q[1]}; }); }catch(e){} return Q; }
/* daily closes (Yahoo via the backend), oldest first: [{d,c}] */
async function hist(tk){ const u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(tk)+'?period1='+Math.floor(Date.parse(addY(today,-4))/1000)+'&period2='+Math.floor(Date.now()/1000)+'&interval=1d';
  try{ const j=await fetch(BE+'?action=fetch&url='+encodeURIComponent(u)).then(r=>r.json()), x=j.chart.result[0], q=x.indicators.quote[0];
    return (x.timestamp||[]).map((t,i)=>({d:new Date((t+19800)*1000).toISOString().slice(0,10),c:q.close[i],o:q.open&&q.open[i],h:q.high&&q.high[i],l:q.low&&q.low[i],v:q.volume&&q.volume[i]})).filter(p=>p.c!=null&&p.c>0); }catch(e){ return []; } }
/* fundamentals (Yahoo quoteSummary via the backend): ratios as reported; null when not available */
async function fund(s){ try{ const u='https://query2.finance.yahoo.com/v10/finance/quoteSummary/'+encodeURIComponent(s+'.NS')+'?modules=summaryDetail,defaultKeyStatistics,financialData,assetProfile,price';
  const j=await fetch(BE+'?action=fetch&url='+encodeURIComponent(u)).then(r=>r.json()), x=j.quoteSummary.result[0], r=o=>o&&o.raw!=null&&isFinite(o.raw)?o.raw:null, d=x.summaryDetail||{}, k=x.defaultKeyStatistics||{}, f=x.financialData||{};
  const ap=x.assetProfile||{};
  return {sec:PF.sectorOf(s,ap.industry,ap.sector),ind:ap.industry||'',mcap:r((x.price||{}).marketCap),pe:r(d.trailingPE),pb:r(k.priceToBook),eps:r(k.trailingEps),bv:r(k.bookValue),roe:r(f.returnOnEquity),pm:r(f.profitMargins),rg:r(f.revenueGrowth),eg:r(f.earningsGrowth),de:r(f.debtToEquity),dy:r(d.dividendYield),tgt:r(f.targetMeanPrice)}; }catch(e){ return null; } }
const closeOn=(S,d)=>{ let c=null; for(const p of S){ if(p.d<=d) c=p.c; else break; } return c; };
/* the same deposits and payouts bought / sold in an index on the same dates */
function idxRun(S,flows,last){ if(!S.length) return null; let u=0; for(const f of flows.slice().sort((a,b)=>a.d.localeCompare(b.d))){ const c=closeOn(S,f.d); if(!c) return null; u+=-f.v/c; }
  const v=u*(last||S[S.length-1].c); return {v,x:PF.xirr(flows.concat([{d:today,v}]).sort((a,b)=>a.d.localeCompare(b.d)))}; }
/* Watchlist engine, daily bars - same rules as watchlist.html analyse() (TF Daily): EMA 9/21 and slope, price vs EMA 9 and the 20-day average,
   RSI 14, volume of the last 3 bars vs the 20 before, fresh 9/21 cross; score -100..100, BUY >= 45, SELL <= -45, else AVOID; levels from ATR 14 */
const ema=(a,n)=>{ const out=Array(a.length).fill(null); if(a.length<n) return out; const k=2/(n+1); let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n; out[n-1]=e; for(let i=n;i<a.length;i++){ e=a[i]*k+e*(1-k); out[i]=e; } return out; };
const tick=x=>Math.round(x*20)/20;
function wlSig(S0,p){ const S=S0.slice(-260).map(x=>Object.assign({},x)); if(S.length<25) return null; if(p){ const z=S[S.length-1]; z.c=p; if(z.h!=null) z.h=Math.max(z.h,p); if(z.l!=null) z.l=Math.min(z.l,p); }
  const c=S.map(x=>x.c), n=c.length, L=n-1, ltp=c[L], e9=ema(c,q('WL_EMA_FAST',9)), e21=ema(c,q('WL_EMA_SLOW',21)), NA=q('IND_ATR_PERIOD',14), NR=q('IND_RSI_PERIOD',14);
  let A=null; for(let i=1;i<n;i++){ const h=S[i].h!=null?S[i].h:c[i], l=S[i].l!=null?S[i].l:c[i], tr=Math.max(h-l,Math.abs(h-c[i-1]),Math.abs(l-c[i-1])); A=A==null?tr:(A*(NA-1)+tr)/NA; }
  let g=0,ls=0; for(let i=1;i<=NR;i++){ const d=c[i]-c[i-1]; if(d>0) g+=d; else ls-=d; } g/=NR; ls/=NR; for(let i=NR+1;i<n;i++){ const d=c[i]-c[i-1]; g=(g*(NR-1)+Math.max(d,0))/NR; ls=(ls*(NR-1)+Math.max(-d,0))/NR; } const R14=ls===0?100:100-100/(1+g/ls);
  const ref=c.slice(-20).reduce((a,x)=>a+x,0)/Math.min(20,n), V=S.map(x=>x.v), hasV=V.slice(-23).every(v=>v!=null&&v>0);
  const av=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length), vr=hasV?av(V.slice(-3))/(av(V.slice(-23,-3))||1):null, mv=c[L]-c[Math.max(0,L-3)];
  let cross=null; for(let i=L;i>21&&i>L-30;i--){ if(e9[i]==null||e9[i-1]==null||e21[i-1]==null) break; if((e9[i]>e21[i])!==(e9[i-1]>e21[i-1])){ cross=L-i; break; } }
  const wT=q('WL_W_TREND',25), wS=q('WL_W_SLOPE',10), wE=q('WL_W_LTP_EMA',10), wR=q('WL_W_REF',15), wI=q('WL_W_RSI',10), wX=q('WL_W_RSI_X',8), wV=q('WL_W_VOL',15), wC=q('WL_W_CROSS',15);
  const bull=e9[L]>e21[L]; let sc=bull?wT:-wT; const sl=e21[L]-e21[Math.max(0,L-3)]; sc+=sl>0?wS:sl<0?-wS:0; sc+=ltp>e9[L]?wE:ltp<e9[L]?-wE:0; sc+=ltp>ref?wR:ltp<ref?-wR:0;
  sc+=R14>q('RSI_BULL',55)?wI:R14<q('RSI_BEAR',45)?-wI:0; if(R14>q('WL_RSI_HOT',75)) sc-=wX; if(R14<q('WL_RSI_COLD',25)) sc+=wX; if(vr!=null&&vr>q('WL_VOL_HI',1.15)) sc+=mv>0?wV:mv<0?-wV:0; if(cross!=null&&cross<=q('WL_CROSS_BARS',3)) sc+=bull?wC:-wC; if(vr!=null&&vr<q('WL_VOL_LO',0.85)) sc*=q('WL_VOL_DAMP',0.8);
  sc=Math.max(-100,Math.min(100,Math.round(sc))); const cs=q('WL_CALL_SCORE',45), call=sc>=cs?'BUY':sc<=-cs?'SELL':'AVOID';

          <tr class="tot"><td class="l">${R.total}</td><td>${inr(CH.brk+CH.gst+CH.stt+CH.stamp+CH.exch+CH.sebi+CH.dp+intr,2)}</td></tr></tbody></table>

      <li>${R.m2(xr==null?'–':pc(xr,1),fdX==null?'–':pc(fdX,1),sbX==null?'–':pc(sbX,1),NR&&NR.x!=null?pc(NR.x,1):'–')}</li>

      ${dpDep>0.5?`<li>${R.m5(inr(dpDep))}</li>`:''}
    </ul></div>

  pages.push(p3); const N=pages.length;
  $('root').innerHTML=pages.map((b,i)=>`<div class="page">${head(i+1,N)}<div class="bd">${b}</div>${foot(i+1,N)}</div>`).join('');
