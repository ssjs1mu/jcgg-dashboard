<script>
'use strict';

const BE='https://script.google.com/macros/s/AKfycbzMp82oHzLzKpaE0LrnUqEGGot7jqSw9e9VA1QhJNOPV35vOIYcfIChFL5PCDuD2Ahi5Q/exec';
const inr=(v,d=0)=>v==null||!isFinite(v)?'–':(v<0?'−':'')+'₹'+Math.abs(Number(v)).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(v,d=0)=>v==null||!isFinite(v)?'–':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const px=v=>num(v,v<100?2:0);   /* share price in text */
const pc=(v,d=2)=>v==null||!isFinite(v)?'–':(v>=0?'+':'')+v.toFixed(d)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=d=>d?d.slice(8,10)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'–';
const dlong=d=>d?(+d.slice(8,10))+' '+R.months[+d.slice(5,7)-1]+' '+d.slice(0,4):'–';
const today=PF.todayS(), days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5), addY=(d,y)=>(+d.slice(0,4)+y)+d.slice(4);
/* bank benchmarks - SBI card rates (general public) at the date of each deposit; editable here when rates change */
const FD_RATES=[['2000-01-01',6.80],['2025-04-15',6.70],['2025-05-16',6.50],['2025-06-15',6.25]];   // 1-2 yr FD
const SB_RATES=[['2000-01-01',2.70],['2025-06-15',2.50]];                                            // savings bank
let IDX_MU=0.11, MKT_MU=0.12, RHO=0.4;   /* outlook: Nifty base return, long-run market return, correlation between shares */
const rateOn=(T,d)=>T.filter(x=>x[0]<=d).slice(-1)[0][1];
/* logic parameters from the master sheet "JC Logic & Formula Reference" (jc-params.js); built-in values if it cannot be read */
const q=(k,d)=>window.JCP&&JCP.P[k]!=null?JCP.P[k]:d;
function useParams(){ IDX_MU=q('CR_IDX_MU',0.11); MKT_MU=q('CR_MKT_MU',0.12); RHO=q('CR_RHO',0.4);
  [[FD_RATES,'CR_FD_RATE'],[SB_RATES,'CR_SB_RATE']].forEach(([T,k])=>{ const v=q(k,null), f=q(k+'_FROM',null); if(v==null||!f) return; const i=T.findIndex(x=>x[0]===f); if(i>=0) T[i][1]=v; else if(f>T[T.length-1][0]){ if(T[T.length-1][1]!==v) T.push([f,v]); } }); }
useParams();
/* the same money in a bank: each deposit is its own deposit at the rate of its day (quarterly compounding), withdrawals come out of the oldest */
function bank(flows,T,toD){ const tr=[], val=(t,d)=>t.p*Math.pow(1+t.r/400,4*days(t.d,d)/365);
  flows.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(f=>{ if(f.v<0) tr.push({d:f.d,p:-f.v,r:rateOn(T,f.d)}); else { let w=f.v; while(w>0.005&&tr.length){ const t=tr[0], v=val(t,f.d); if(v<=w){ w-=v; tr.shift(); } else { t.p=(v-w)/Math.pow(1+t.r/400,4*days(t.d,f.d)/365); w=0; } } } });
  return tr.reduce((a,t)=>a+val(t,toD),0); }
async function quotes(syms){ const Q={}; if(!syms.length) return Q; try{ const j=await fetch(BE+'?action=liveq&symbols='+encodeURIComponent(syms.map(s=>s+'.NS').join(','))).then(r=>r.json());
  Object.keys(j.q||{}).forEach(k=>{ const q=j.q[k]; if(q&&q[0]>0) Q[k.replace(/\.NS$/,'')]={p:q[0],pc:q[1]}; }); }catch(e){} return Q; }
/* daily closes (Yahoo via the backend), oldest first: [{d,c}] */
async function hist(tk){ const u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(tk)+'?period1='+Math.floor(Date.parse(addY(today,-4))/1000)+'&period2='+Math.floor(Date.now()/1000)+'&interval=1d';
  try{ const j=await fetch(BE+'?action=fetch&url='+encodeURIComponent(u)).then(r=>r.json()), x=j.chart.result[0], q=x.indicators.quote[0];
    return (x.timestamp||[]).map((t,i)=>({d:new Date((t+19800)*1000).toISOString().slice(0,10),c:q.close[i],o:q.open&&q.open[i],h:q.high&&q.high[i],l:q.low&&q.low[i],v:q.volume&&q.volume[i]})).filter(p=>p.c!=null&&p.c>0); }catch(e){ return []; } }
const closeOn=(S,d)=>{ let c=null; for(const p of S){ if(p.d<=d) c=p.c; else break; } return c; };
/* the same deposits and payouts bought / sold in an index on the same dates */
function idxRun(S,flows,last){ if(!S.length) return null; let u=0; for(const f of flows.slice().sort((a,b)=>a.d.localeCompare(b.d))){ const c=closeOn(S,f.d); if(!c) return null; u+=-f.v/c; }
  const v=u*(last||S[S.length-1].c); return {v,x:PF.xirr(flows.concat([{d:today,v}]).sort((a,b)=>a.d.localeCompare(b.d)))}; }
/* Watchlist engine, daily bars - same rules as watchlist.html analyse() (TF Daily): EMA 9/21 and slope, price vs EMA 9 and the 20-day average,
   RSI 14, volume of the last 3 bars vs the 20 before, fresh 9/21 cross; score -100..100, BUY >= 45, SELL <= -45, else AVOID; levels from ATR 14 */
const ema=(a,n)=>{ const out=Array(a.length).fill(null); if(a.length<n) return out; const k=2/(n+1); let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n; out[n-1]=e; for(let i=n;i<a.length;i++){ e=a[i]*k+e*(1-k); out[i]=e; } return out; };
const tick=x=>Math.round(x*20)/20;
function wlSig(S0,p){ const S=S0.slice(-260).map(x=>Object.assign({},x)); if(S.length<25) return null; if(p){ const z=S[S.length-1]; z.c=p; if(z.h!=null) z.h=Math.max(z.h,p); if(z.l!=null) z.l=Math.min(z.l,p); }
  const c=S.map(x=>x.c), n=c.length, L=n-1, ltp=c[L], e9=ema(c,q('WL_EMA_FAST',9)), e21=ema(c,q('WL_EMA_SLOW',21)), NA=q('IND_ATR_PERIOD',14), NR=q('IND_RSI_PERIOD',14);
  let A=null; for(let i=1;i<n;i++){ const h=S[i].h!=null?S[i].h:c[i], l=S[i].l!=null?S[i].l:c[i], tr=Math.max(h-l,Math.abs(h-c[i-1]),Math.abs(l-c[i-1])); A=A==null?tr:(A*(NA-1)+tr)/NA; }
  let g=0,ls=0; for(let i=1;i<=NR;i++){ const d=c[i]-c[i-1]; if(d>0) g+=d; else ls-=d; } g/=NR; ls/=NR; for(let i=NR+1;i<n;i++){ const d=c[i]-c[i-1]; g=(g*(NR-1)+Math.max(d,0))/NR; ls=(ls*(NR-1)+Math.max(-d,0))/NR; } const R14=ls===0?100:100-100/(1+g/ls);
  const ref=c.slice(-20).reduce((a,x)=>a+x,0)/Math.min(20,n), V=S.map(x=>x.v), hasV=V.slice(-23).every(v=>v!=null&&v>0);
  const av=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length), vr=hasV?av(V.slice(-3))/(av(V.slice(-23,-3))||1):null, mv=c[L]-c[Math.max(0,L-3)];
  let cross=null; for(let i=L;i>21&&i>L-30;i--){ if(e9[i]==null||e9[i-1]==null||e21[i-1]==null) break; if((e9[i]>e21[i])!==(e9[i-1]>e21[i-1])){ cross=L-i; break; } }
  const wT=q('WL_W_TREND',25), wS=q('WL_W_SLOPE',10), wE=q('WL_W_LTP_EMA',10), wR=q('WL_W_REF',15), wI=q('WL_W_RSI',10), wX=q('WL_W_RSI_X',8), wV=q('WL_W_VOL',15), wC=q('WL_W_CROSS',15);
  const bull=e9[L]>e21[L]; let sc=bull?wT:-wT; const sl=e21[L]-e21[Math.max(0,L-3)]; sc+=sl>0?wS:sl<0?-wS:0; sc+=ltp>e9[L]?wE:ltp<e9[L]?-wE:0; sc+=ltp>ref?wR:ltp<ref?-wR:0;
  sc+=R14>q('RSI_BULL',55)?wI:R14<q('RSI_BEAR',45)?-wI:0; if(R14>q('WL_RSI_HOT',75)) sc-=wX; if(R14<q('WL_RSI_COLD',25)) sc+=wX; if(vr!=null&&vr>q('WL_VOL_HI',1.15)) sc+=mv>0?wV:mv<0?-wV:0; if(cross!=null&&cross<=q('WL_CROSS_BARS',3)) sc+=bull?wC:-wC; if(vr!=null&&vr<q('WL_VOL_LO',0.85)) sc*=q('WL_VOL_DAMP',0.8);
  sc=Math.max(-100,Math.min(100,Math.round(sc))); const cs=q('WL_CALL_SCORE',45), call=sc>=cs?'BUY':sc<=-cs?'SELL':'AVOID';
  let lv=null; if(call!=='AVOID'&&A){ const dir=call==='BUY'?1:-1, dist=Math.abs(ltp-e21[L])+q('WL_RISK_EXTRA_ATR',0.25)*A, risk=Math.min(q('WL_SL_MAX_ATR',3)*A,Math.max(q('WL_SL_MIN_ATR',1)*A,dist)), en=tick(ltp); lv={en,sl:tick(en-dir*risk),t1:tick(en+dir*risk),t2:tick(en+dir*2*risk),t3:tick(en+dir*3*risk)}; }
  return {score:sc,conv:Math.abs(sc),call,lv,bull,rsi:R14,vr,e21:e21[L],atr:A}; }
/* trend, levels and a 1-2 year range from the price history (needs ~1 year of daily closes); the Watchlist signal decides the near-term call */
function stats(S,p){ const D=S.filter(x=>x.d>addY(today,-1)); if(D.length<120) return null; p=p||S[S.length-1].c;
  const avg=n=>{ const a=S.slice(-n); return a.reduce((s,x)=>s+x.c,0)/a.length; }, d50=avg(50), d200=avg(200), hi=Math.max(...D.map(x=>x.c),p), lo=Math.min(...D.map(x=>x.c),p);
  const r=[]; for(let i=1;i<D.length;i++) r.push(Math.log(D[i].c/D[i-1].c)); const m=r.reduce((a,b)=>a+b,0)/r.length, vol=Math.min(q('CR_VOL_CAP',0.40),Math.sqrt(r.reduce((a,b)=>a+(b-m)*(b-m),0)/(r.length-1))*Math.sqrt(252));
  const c1=closeOn(S,addY(today,-1)), c3=closeOn(S,addY(today,-3)), r1=c1?p/c1-1:null, cagr3=c3?Math.pow(p/c3,1/3)-1:(r1!=null?r1:MKT_MU);

      <table><thead><tr><th class="l">${R.thShare}</th><th>${R.thQty}</th><th>${R.thAvg}</th><th>${R.thNow}</th><th>${R.thVal}</th><th>${R.thGain}</th><th>${R.thPct}</th><th>${R.thPort}</th></tr></thead><tbody>
      ${H.map((h,i)=>`<tr><td class="l"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${COLS[i%10]};margin-right:5px"></span><b>${esc(h.sym)}</b><div class="mu" style="font-size:9.5px">${esc(h.sec)}${h.since?' · '+R.since(dmy(h.since)):''}</div></td><td>${num(h.q)}</td><td>${h.avg!=null?num(h.avg,2):'–'}</td><td>${h.p?num(h.p,2):'–'}</td><td><b>${inr(h.v)}</b></td><td class="${(h.pl||0)>=0?'up':'dn'}">${h.pl!=null?inr(h.pl):'–'}</td><td class="${(h.pl||0)>=0?'up':'dn'}">${h.pl!=null&&h.c?pc(h.pl/h.c*100,1):'–'}</td><td>${hv?(h.v/hv*100).toFixed(1)+'%':'–'}</td></tr>`).join('')}
      <tr class="tot"><td class="l">${R.total}</td><td></td><td></td><td></td><td>${inr(hv)}</td><td class="${H.reduce((a,h)=>a+(h.pl||0),0)>=0?'up':'dn'}">${inr(H.reduce((a,h)=>a+(h.pl||0),0))}</td><td></td><td>100%</td></tr></tbody></table></div>
    ${other.filter(r=>/demerger/i.test(r.a.sub)).map(r=>`<div class="note" style="margin:4px 0;color:#7b2d8b">${R.demerger(esc(r.sym),dlong(r.a.ex),r.q<10,num(r.q))}</div>`).join('')}
    <div class="note">${R.prices(asOf,M.asOf?dlong(M.asOf):'',M.dpac?esc(M.dpac):'')}</div>`;

  /* ---------- stock views + 1-2 year outlook ---------- */
  const card=h=>{ const s=h.st; if(!s) return `<div class="sc"><div class="sch"><b class="nm">${esc(h.sym)}</b><span class="sec">${esc(h.sec)}</span><span class="vw vNA">${R.vNA}</span></div><div class="note">${R.noHist}</div></div>`;
    const tc={Strong:'#13863a',Up:'#22a35a',Side:'#a0761a',Down:'#c62828'}[s.trend], gp1=h.pl!=null&&h.c?h.pl/h.c*100:null;
    return `<div class="sc"><div class="sch"><b class="nm">${esc(h.sym)}</b><span class="sec">${esc(h.sec)} · ₹${num(s.p,2)}</span><span class="tg" style="color:${tc}">${R['t'+s.trend]}</span><span class="vw v${s.view}">${R['v'+s.view]}</span></div>
      <div class="scg"><div>${spark(s.spark,s)}</div><div class="chips">
        <div class="chip"><span>${R.c1y}</span><b class="${(s.r1||0)>=0?'up':'dn'}">${s.r1==null?'–':pc(s.r1*100,1)}</b></div>
        <div class="chip"><span>${R.cN1y}</span><b class="${(n1y||0)>=0?'up':'dn'}">${n1y==null?'–':pc(n1y*100,1)}</b></div>
        <div class="chip"><span>${R.cGain}</span><b class="${(gp1||0)>=0?'up':'dn'}">${gp1==null?'–':pc(gp1,1)}</b></div>
        <div class="rng"><span>${R.cRange}</span><div class="rtr"><i style="left:calc(${(s.pos*100).toFixed(1)}% - 2px)"></i></div><div class="rl"><span>₹${px(s.lo)}</span><b style="color:var(--dk)">₹${px(s.p)}</b><span>₹${px(s.hi)}</span></div></div>
      </div></div>
      <div class="sct">${s.W?`• ${R.sig(`<b class="${s.W.call==='BUY'?'up':s.W.call==='SELL'?'dn':'mu'}">${R['c'+s.W.call]}</b>`,s.W.conv,s.W.bull,s.W.rsi.toFixed(0),s.W.vr==null?'':s.W.vr>1.15?R.vUp:s.W.vr<0.85?R.vDn:R.vFlat)}<br>`:''}• ${s.txt}${gp1!=null&&gp1>40&&s.pos>=0.8?' '+R.profit(gp1.toFixed(0)):''}<br>• ${R.outlook(px(s.y1.b),px(s.y2.b),px(s.y2.l),px(s.y2.h))}</div>
      <table class="lv"><thead><tr><th class="l">${R.lSig}</th><th>${R.lEn}</th><th>${R.lSl}</th><th>T1</th><th>T2</th><th>T3</th><th>${R.l1}</th><th>${R.l2}</th></tr></thead><tbody><tr>
        <td class="l"><b class="${s.W&&s.W.call==='BUY'?'up':s.W&&s.W.call==='SELL'?'dn':'mu'}">${s.W?R['c'+s.W.call]+' · '+s.W.conv:'–'}</b></td>
        <td class="up">${s.lv?'₹'+px(s.lv.en):'–'}</td><td class="dn">${s.rev?'₹'+px(s.rev):'–'}</td>
        ${['t1','t2','t3'].map(k=>`<td>${s.lv?'₹'+px(s.lv[k]):'–'}</td>`).join('')}
        <td><b>₹${px(s.y1.b)}</b> <span class="mu">(${pc((Math.pow(1+s.mu,1)-1)*100,0)})</span></td><td><b>₹${px(s.y2.b)}</b> <span class="mu">(${pc((s.y2.b/s.p-1)*100,0)})</span></td></tr></tbody></table></div>`; };
  const s5=SH.length?`<h2><i>5</i>${R.s5}</h2><div class="card"><table><thead><tr><th class="l"></th><th>${R.thToday}</th><th>${R.th1}</th><th>${R.th2}</th></tr></thead><tbody>
      <tr><td class="l"><b>${R.rBase}</b></td><td><b>${inr(mine)}</b></td><td class="up"><b>${inr(pB(1))}</b></td><td class="up"><b>${inr(pB(2))}</b></td></tr>
      <tr><td class="l mu">${R.rRange}</td><td></td><td class="mu">${inr(pR(1).l)} – ${inr(pR(1).h)}</td><td class="mu">${inr(pR(2).l)} – ${inr(pR(2).h)}</td></tr>
      ${NR?`<tr><td class="l">${R.rNifty}</td><td>${inr(NR.v)}</td><td>${inr(NR.v*(1+IDX_MU))}</td><td>${inr(NR.v*Math.pow(1+IDX_MU,2))}</td></tr>`:''}
      <tr><td class="l">${R.rFd(fdNow)}</td><td>${inr(fdV)}</td><td>${inr(fdT(fdV,1))}</td><td>${inr(fdT(fdV,2))}</td></tr></tbody></table>
      <div class="note" style="margin-top:5px">${R.note5}</div></div>`:'';
  const per=H.length<=3?3:5, chunks=[]; for(let i=0;i<H.length;i+=per) chunks.push(H.slice(i,i+per)); if(!chunks.length) chunks.push([]);
  const vp=chunks.map((c,i)=>(i===0?`<h2><i>4</i>${R.s4}</h2>`:'')+c.map(card).join('')+(i===chunks.length-1&&c.length<=3?s5:''));
  if(chunks[chunks.length-1].length>3&&s5) vp.push(s5);

  /* ---------- journey, dividends, costs, meaning, method ---------- */
  const p3=`<h2><i>6</i>${R.s6}</h2>
    <div class="tl ${evShow.length>9?'tl2':''}" style="margin-bottom:6px">${evShow.map(e=>`<div class="ev" style="--c:${e.c}"><b>${e.d?dlong(e.d)+' · ':''}${e.t}</b><br><span>${esc(e.s)}</span></div>`).join('')}</div>
    <div class="row" style="grid-template-columns:1.15fr 1fr">
      <div class="card"><div class="big">${R.divT}</div>
        ${divs.length?`<table style="margin-top:4px"><thead><tr><th class="l">${R.thDate}</th><th class="l">${R.thShare}</th><th>${R.thShares}</th><th>${R.thPer}</th><th>${R.thAmt}</th></tr></thead><tbody>${divs.slice().sort((a,b)=>a.a.ex.localeCompare(b.a.ex)).map(r=>`<tr><td class="l" style="white-space:nowrap">${dmy(r.a.ex)}</td><td class="l">${esc(r.sym)}</td><td>${num(r.q)}</td><td>${num(r.a.amt,2)}</td><td class="up">${inr(r.div,2)}</td></tr>`).join('')}<tr class="tot"><td class="l" colspan="4">${R.total}</td><td class="up">${inr(divT,2)}</td></tr></tbody></table>`:`<div class="note">${R.noDiv}</div>`}
      </div>
      <div class="card"><div class="big">${R.costT}</div>
        <table style="margin-top:4px"><tbody>
          <tr><td class="l">${R.cBrk}</td><td>${inr(brk,2)}</td></tr><tr><td class="l">${R.cTax}</td><td>${inr(tax,2)}</td></tr>
          <tr><td class="l">${R.cDp}</td><td>${inr(dpChg,2)}</td></tr>${intr?`<tr><td class="l">${R.cInt}</td><td>${inr(intr,2)}</td></tr>`:''}
          <tr class="tot"><td class="l">${R.total}</td><td>${inr(brk+tax+dpChg+intr,2)}</td></tr></tbody></table>
        <div class="note">${R.costNote}</div></div>
    </div>
    <h2><i>7</i>${R.s7}</h2>
    <div class="card"><ul class="pts">
      <li>${R.m1(dlong(start),inr(netIn),inr(mine))}</li>
      <li>${R.m2(xr==null?'–':pc(xr,1),fdX==null?'–':pc(fdX,1),sbX==null?'–':pc(sbX,1),NR&&NR.x!=null?pc(NR.x,1):'–')}</li>
      <li>${ahead>=0?R.m3up(inr(ahead)):R.m3dn(inr(-ahead))}</li>
      <li>${R.m4(H.length,H[0]?esc(H[0].sym):'',hv&&H[0]?(H[0].v/hv*100).toFixed(0):'0')}</li>
      ${dpDep>0.5?`<li>${R.m5(inr(dpDep))}</li>`:''}
    </ul></div>
    <h2><i>8</i>${R.s8}</h2>
    <div class="note" style="columns:2;column-gap:18px;font-size:9.6px;line-height:1.33"><ul class="pts" style="margin-top:0"><li>${R.h1(useL,cash>0.5,dpDep>0.5)}</li><li>${R.h2}</li><li>${R.h3}</li><li>${R.h4}</li><li>${R.h5}</li><li>${R.h6}</li><li>${R.h7}</li></ul></div>`;

  const pages=[p1,...vp,p3], N=pages.length;
  $('root').innerHTML=pages.map((b,i)=>`<div class="page">${head(i+1,N)}<div class="bd">${b}</div>${foot(i+1,N)}</div>`).join('');
  document.title=C+' Portfolio report '+today+(LG!=='en'?' '+LG:'');
  if(P.get('print')==='1') setTimeout(()=>window.print(),1200);
})().catch(e=>{ $('msg').textContent='Could not build the report - '+e.message; });
</script></body></html>
